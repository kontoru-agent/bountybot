name: bountybot-fuzz

# External compute lane: heavy fuzzing runs on GitHub-hosted runners
# (4 vCPU / 16 GB) instead of the agent's local cell.
# Trigger manually with chosen target + budget.
on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: "Directory holding contracts/ and echidna.yaml"
        required: true
        default: "fuzz-lane"
      test_limit:
        description: "Echidna testLimit override (blank = config value)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  echidna:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install solc 0.8.26
        run: |
          curl -fsSL -o /usr/local/bin/solc https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a
          chmod +x /usr/local/bin/solc
          solc --version

      - name: Install Echidna 2.4.0
        run: |
          curl -fsSL -o echidna.tar.gz https://github.com/crytic/echidna/releases/download/v2.4.0/echidna-2.4.0-x86_64-linux.tar.gz
          tar -xzf echidna.tar.gz
          sudo mv echidna /usr/local/bin/
          echidna --version

      - name: Install crytic-compile
        run: pip install crytic-compile

      - name: Run Echidna
        working-directory: ${{ inputs.target_dir }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ inputs.test_limit }}" ]; then
            sed -i "s/^testLimit:.*/testLimit: ${{ inputs.test_limit }}/" echidna.yaml
          fi
          echidna --contract SmokeVaultTest --config echidna.yaml contracts/SmokeVault.sol
        # NOTE: --contract is smoke-specific; real campaigns parametrize per target.

      - name: Upload corpus and reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-output
          path: |
            ${{ inputs.target_dir }}/corpus
          if-no-files-found: ignore
